<div class="col-lg-3 col-md-6 mb-4">
    <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <div>                  <h6 class="text-muted mb-2">                        {{ titulo }}                    </h6>
                    <h2 class="fw-bold mb-0">                        {{ cantidad }}                    </h2>
                </div>
                <div>                    <i class="{{ icono }} fs-1 text-success"></i>                </div>
            </div>
        </div>
        {% if enlace %}
        <div class="card-footer bg-white border-0">
            <a    href="{{ enlace }}" class="text-decoration-none small fw-semibold"><i class="bi bi-arrow-right">Ver detalles </i></a>
        </div>
        {% endif %}
    </div>
</div>
