<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">            <i class="{{ icono }}"></i>            {{ titulo }}        </h2>
        <p class="text-muted mb-0">           {{ subtitulo }}        </p>
    </div>
    {% if boton_texto %}
        <a           href="{{ boton_url }}"  class="btn btn-success shadow-sm">            <i class="{{ boton_icono }}"></i>{{ boton_texto }}        </a>
    {% endif %}
</div>
