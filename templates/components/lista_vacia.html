<div class="card shadow-sm">
    <div class="card-body text-center py-5">
        <i class="{{ icono }} display-1 text-secondary"></i>
        <h4 class="mt-3">            {{ titulo }}        </h4>
        <p class="text-muted">            {{ mensaje }}        </p>
        {% if boton_texto %}
        <a      href="{{ boton_url }}"          class="btn btn-success">            <i class="{{ boton_icono }}"></i>            {{ boton_texto }}        </a>
        {% endif %}
    </div>
</div>
