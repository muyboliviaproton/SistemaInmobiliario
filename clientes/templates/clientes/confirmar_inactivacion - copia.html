{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"          content="width=device-width, initial-scale=1.0">
    <title>Confirmar inactivación</title>
    <!-- Bootstrap 5.3 -->
    <link    href="{% static 'bootstrap/css/bootstrap.min.css' %}"    rel="stylesheet">
	<style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .contenedor {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .icono {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
        }

        .cliente {
            font-weight: bold;
            color: #222;
        }

        .botones {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button,
        a {
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            border: none;
        }

        .btn-confirmar {
            background: #dc3545;
            color: white;
        }

        .btn-confirmar:hover {
            background: #bb2d3b;
        }

        .btn-cancelar {
            background: #6c757d;
            color: white;
        }

        .btn-cancelar:hover {
            background: #545b62;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="icono">
            ⚠️
        </div>

        <h1>
            Confirmar cambio de estado
        </h1>

        <p>
            ¿Está seguro de marcar como
            <strong>INACTIVO</strong>
            al siguiente cliente?
        </p>

        <p class="cliente">
            {{ cliente.nombre_completo }}
        </p>

        <p>          El cliente no será eliminado.
            Podrá volver a editar su información posteriormente.
        </p>

        <div class="botones">
            <a                href="{% url 'clientes:cliente_lista' %}"                class="btn-cancelar"            >
                Cancelar
            </a>

            <form                method="POST"                style="display: inline;"            >
                {% csrf_token %}
                <button                    type="submit"                    class="btn-confirmar"                >
                    Sí, marcar como INACTIVO
                </button>

            </form>

        </div>

    </div>
<script    src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
